# ks-kuzuha-alternative — PHP min bundle manifest.
#
# dist/build.py reads this file: it fetches each component at the pinned
# commit, builds the UI with [ui], copies [[files]] into the bundle and
# writes build/<name>-<version>.zip (+ .sha256).
#
# Component URLs are the public repositories. While they are private, build
# locally with --src <component>=<local clone> (see README / Makefile).

[bundle]
name = "ks-kuzuha-alternative"
version = "0.1.0-alpha.1"
# Top folder inside the zip. {name} and {version} are substituted.
top = "{name}-{version}"

# Shown in the UI footer and on the About page ("<name> v<version>",
# linking to url): put as "release" into the build-time UI config. {name}
# and {version} are substituted.
[bundle.release]
name = "{name}"
url = "https://github.com/kimari-s/{name}"

[components.ks-sw-api]
url = "https://github.com/kimari-s/ks-sw-api.git"
commit = "fbb57cd28a193b76ade7e7e8239cbc056bc16c38"  # v0.2.0-alpha.1 + cooldown 5 s, admin.php password setup form, /v1/meta impl_url, sample admin token refused (kssw 1, ks-sw-spec 71ef927)

[components.ks-kuzuha-ui]
url = "https://github.com/kimari-s/ks-kuzuha-ui.git"
commit = "5bea480082ce00e8ffedb17e9f55fb27fb2cb573"  # v0.5.0-alpha.1 + about.html links, settings-page security self-check, header View menu, boardTags / postTags, listing scope Local / Global, new icon

# The UI build: run in the ks-kuzuha-ui checkout. `config` is a path in this
# repo (apiBaseUrl "./api": same origin, no CORS); `defaults` (board name,
# colours, tags) and "release" are merged over it, and the result is passed
# as KUZUHA_CONFIG. It is neutral: every variant (the plain zip, the demo)
# ships the same UI build. Every other KUZUHA_* / VITE_* variable is removed
# from the environment so the build depends only on this manifest.
#
# `defaults` is also shipped as `defaults_to` (config.example.json), the
# operator's template: copied to config.json and edited by FTP, it is read
# at load. The plain zip has no config.json, so an upgrade keeps the
# operator's. build.py --site-config ships a config.json too, at
# `site_config_to` (the demo: make deploy-demo uploads it only when the
# server has none).
[ui]
component = "ks-kuzuha-ui"
install = ["npm", "ci", "--no-audit", "--no-fund"]
build = ["npm", "run", "build"]
output = "dist"
config = "config/bundle.json"
defaults = "config/site.json"
defaults_to = "bbs/config.example.json"
site_config_to = "bbs/config.json"

# What goes where. `from` is "<component>:<path>" or "self:<path>" (this
# repo); a path ending in "/" copies a directory tree. `to` is relative to
# the top folder. Files matching `exclude` (fnmatch on the path relative to
# `from`, and on each path segment) are left out. A pattern starting with
# "/" is anchored to `from` (e.g. "/config.php" spares lib/config.php).
# `executable = true` ships the file as 0755 (else 0644).
[[files]]
from = "ks-kuzuha-ui:dist/"
to = "bbs/"

[[files]]
from = "ks-sw-api:php/api/"
to = "bbs/api/"
exclude = ["/config.php", "/data", "*.sqlite3", "*.sqlite3-*"]

# Optional: the kssw discovery document (/.well-known/kssw) for the host's
# document root, outside bbs/ (README.txt says how to place it). Its
# base "/bbs/api" fits bbs/ uploaded to the document root.
[[files]]
from = "ks-sw-api:php/well-known/"
to = "well-known/"
exclude = ["README.md"]

# The admin CLI: runs on the operator's machine, so it sits outside the
# upload folder bbs/.
[[files]]
from = "ks-sw-api:tools/kssw-admin"
to = "tools/kssw-admin"
executable = true

[[files]]
from = "self:dist/tools-README.txt"
to = "tools/README.txt"

[[files]]
from = "self:dist/README.txt"
to = "README.txt"

[[files]]
from = "self:LICENSE"
to = "LICENSES/ks-kuzuha-alternative.txt"

[[files]]
from = "ks-sw-api:LICENSE"
to = "LICENSES/ks-sw-api.txt"

[[files]]
from = "ks-kuzuha-ui:LICENSE"
to = "LICENSES/ks-kuzuha-ui.txt"

[[files]]
from = "ks-kuzuha-ui:public/fonts/LICENSE-UDEVGothic.txt"
to = "LICENSES/UDEVGothic-OFL.txt"

[[files]]
from = "ks-kuzuha-ui:public/LICENSE-MaterialSymbols.txt"
to = "LICENSES/MaterialSymbols-Apache-2.0.txt"

# Never shipped, whatever the source: OS / editor litter.
[global]
exclude = [".DS_Store", "Thumbs.db", "*~", ".git", ".gitignore"]
